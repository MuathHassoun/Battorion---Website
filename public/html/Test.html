<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Send Image to Telegram</title>
</head>
<body>
<h2>Send Image to Telegram</h2>
<input type="file" id="photoInput" accept="image/*" />
<button onclick="sendPhoto()">Send to Telegram</button>

<p id="status"></p>

<script>
  const BOT_TOKEN = process.env.TELEGRAM_BOT_TOKEN;
  const CHAT_ID = process.env.TELEGRAM_CHAT_ID;

  async function sendPhoto() {
    const input = document.getElementById('photoInput');
    const file = input.files[0];

    if (!file) {
      document.getElementById('status').textContent = 'Please select an image.';
      return;
    }

    const formData = new FormData();
    formData.append('chat_id', CHAT_ID);
    formData.append('photo', file);

    try {
      const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
        method: 'POST',
        body: formData
      });

      const result = await response.json();

      if (result.ok) {
        document.getElementById('status').textContent = '✅ Image sent successfully!';
      } else {
        document.getElementById('status').textContent = `❌ Failed: ${result.description}`;
      }
    } catch (error) {
      console.error(error);
      document.getElementById('status').textContent = '❌ Error sending photo.';
    }
  }
</script>
</body>
</html>
