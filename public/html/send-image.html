<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Upload Your Image</title>
  <link rel="stylesheet" href="../css/image-upload.css" />
  <link rel="icon" href="../img/battorion.png" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="container">
    <h2>📷 Upload Your Image</h2>

    <label for="photoInput" class="custom-file-upload">Select Image</label>
    <input type="file" id="photoInput" accept="image/*" />
    <p id="fileMessage" class="file-message" style="display: none;"></p>

    <button onclick="sendPhoto()">Send Image</button>
    <p id="status" style="display: none;"></p>
  </div>

  <script src="../js/app.js"></script>
  <script src="../js/_xhtr.js"></script>
  <script>
    const input = document.getElementById('photoInput');
    const fileMessage = document.getElementById('fileMessage');
    const status = document.getElementById('status');
    input.addEventListener('change', () => {
      if (input.files.length) {
        const fileName = input.files[0].name;
        fileMessage.innerHTML = `✅ <strong>${fileName}</strong> selected successfully.`;
        fileMessage.style.display = 'block';
        fileMessage.style.opacity = '1';
      } else {
        fileMessage.innerHTML = '';
        fileMessage.style.display = 'none';
      }
    });

    async function sendPhoto() {
      status.style.display = 'block';
      if (!input.files.length) {
        status.textContent = '⚠️ Please select an image first.';
        return;
      }

      const formData = new FormData();
      formData.append('screenshot', input.files[0]);
      status.textContent = '📤 Uploading...';
      try {
        const res = await fetch('/api/send-photo-only', {
          method: 'POST',
          body: formData,
        });

        const result = await res.json();
        if (res.ok) {
          status.textContent = '✅ Image sent successfully!';
          setTimeout(() => location.reload(), 1500);
        } else {
          status.textContent = '❌ Failed: ' + (result.error || 'Unknown error');
        }
      } catch (err) {
        status.textContent = '❌ Error sending image.';
      }
    }
  </script>
</body>
</html>
