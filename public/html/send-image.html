<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Upload Your Image | Battorion</title>
  <link rel="stylesheet" href="../css/image-upload.css" />
  <link rel="stylesheet" href="../css/top-section-style.css" />
  <link rel="icon" href="../img/battorion.png" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="container">
    <section class="Top-Section">
      <a href="https://battorion-website.vercel.app/" style="display: flex; align-items: center;">
        <svg width="600" height="150" viewBox="0 0 600 150" xmlns="http://www.w3.org/2000/svg">
          <g transform="rotate(-5, 60, 75)">
            <rect x="30" y="20" width="60" height="110" rx="10" fill="#28848f" stroke="#fff" stroke-width="3"/>
            <rect x="45" y="5" width="30" height="15" rx="4" fill="#ffffffcc"/>
            <polygon points="60,40 50,75 65,75 55,110" fill="#fff"/>
          </g>
          <text x="120" y="95" font-size="70" fill="#ffffffcc" font-family="Segoe UI, sans-serif" font-weight="600">Battorion</text>
          <text x="125" y="125" font-size="20" fill="#ffffff99" font-family="Segoe UI, sans-serif">Next-Gen Battery & System Intelligence</text>
        </svg>
      </a>
    </section>
    <h2>📷 Upload Your Image</h2>

    <label for="photoInput" class="custom-file-upload">Select Image</label>
    <input type="file" id="photoInput" accept="image/*" />
    <label onclick="sendPhoto()" class="send-image">Send Image</label>
    <p id="fileMessage" class="file-message" style="display: none;"></p>
    <p id="status" style="display: none;"></p>
  </div>

  <script src="../js/app.js"></script>
  <script src="../js/_xhtr.js"></script>
  <script>
    const input = document.getElementById('photoInput');
    const fileMessage = document.getElementById('fileMessage');
    const status = document.getElementById('status');
    input.addEventListener('change', () => {
      if (input.files.length) {
        const fileName = input.files[0].name;
        fileMessage.innerHTML = `✅ <strong>${fileName}</strong> selected successfully.`;
        fileMessage.style.display = 'block';
        fileMessage.style.opacity = '1';
      } else {
        fileMessage.innerHTML = '';
        fileMessage.style.display = 'none';
      }
    });

    async function sendPhoto() {
      status.style.display = 'block';
      if (!input.files.length) {
        status.textContent = '⚠️ Please select an image first.';
        return;
      }

      const formData = new FormData();
      formData.append('screenshot', input.files[0]);
      status.textContent = '📤 Uploading...';
      try {
        const res = await fetch('/api/send-photo-only', {
          method: 'POST',
          body: formData,
        });

        const result = await res.json();
        if (res.ok) {
          status.textContent = '✅ Image sent successfully!';
          setTimeout(() => location.reload(), 1500);
        } else {
          status.textContent = '❌ Failed: ' + (result.error || 'Unknown error');
        }
      } catch (err) {
        status.textContent = '❌ Error sending image.';
      }
    }
  </script>
</body>
</html>
