<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="../img/logo.svg" />
  <title>Battorion Latest Release</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&display=swap');
    * {
      font-family: 'Merriweather', serif;
    }

    :root {
      --radius: 20px;
      --card-bg: rgba(255, 255, 255, 0.06);
      --card-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
      --btn-bg: #6c5ce7;
      --hover-brightness: 1.13;
      --text: #f0f0f0;
      --subtitle-color: #a8a8a8;
      --subtitle-font-size: 30px;
    }

    html[data-theme="dark"] {
      --bg: linear-gradient(to bottom, #0f2027, #203a43, #2c5364);
    }

    body {
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 2rem;
      margin: 0;
    }

    .release-card {
      background: var(--card-bg);
      padding: 2rem;
      border-radius: var(--radius);
      box-shadow: var(--card-shadow);
      max-width: 750px;
      width: 100%;
    }

    .release-card h1 {
      text-align: center;
      margin-bottom: 1.5rem;
      color: var(--text);
    }

    .release-table {
      display: grid;
      grid-template-columns: 1fr 2fr;
      row-gap: 0.8rem;
      column-gap: 1rem;
    }

    .release-title {
      font-weight: bold;
      color: var(--subtitle-color);
      word-break: break-word;
    }

    .release-value {
      color: var(--text);
      word-break: break-word;
    }

    .release-value a {
      color: var(--text);
      text-decoration: none;
    }

    .release-value a:hover {
      text-decoration: underline;
    }

    .author {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 1rem;
    }

    .author img {
      width: 80px;
      height: 80px;
      border-radius: 50%;
    }

    .author a {
      color: var(--text);
      text-decoration: none;
      font-size: var(--subtitle-font-size);
    }

    .author a:hover {
      text-decoration: underline;
    }

    .description {
      margin-top: 1.5rem;
      padding-top: 0.8rem;
      border-top: 1px solid var(--subtitle-color);
    }

    .button-container {
      display: flex;
      align-items: flex-end;
      gap: 1rem;
      width: 100%;
      justify-content: flex-end;
    }

    .button {
      display: inline-block;
      margin-top: 1.5rem;
      padding: 1rem 1.5rem;
      background: var(--btn-bg);
      color: var(--text);
      text-decoration: none;
      border-radius: 10px;
      transition: filter 0.3s;
      text-align: center;
    }

    .button:hover {
      filter: brightness(var(--hover-brightness));
    }
  </style>
</head>
<body>

<div class="release-card">
  <h1 id="version-text">Loading...</h1>
  <div class="author" id="author-info"></div>
  <br>
  <div class="release-table">
    <div class="release-title">Release Name:</div><div class="release-value" id="release-name"></div>
    <div class="release-title">Prerelease:</div><div class="release-value" id="prerelease"></div>
    <div class="release-title">Created At:</div><div class="release-value" id="created-at"></div>
    <div class="release-title">Published At:</div><div class="release-value" id="published-at"></div>
    <div class="release-title">Updated At:</div><div class="release-value" id="updated-at"></div>
    <div class="release-title">File Name:</div><div class="release-value" id="file-name"></div>
    <div class="release-title">File Size:</div><div class="release-value" id="file-size"></div>
    <div class="release-title">Content Type:</div><div class="release-value" id="content-type"></div>
    <div class="release-title">Download Count:</div><div class="release-value" id="download-count"></div>
    <div class="release-title">SHA256 Digest:</div><div class="release-value" id="digest"></div>
    <div class="release-title">Release Page:</div><div class="release-value"><a id="html-url" href="#" target="_blank">View on GitHub</a></div>
    <div class="release-title">Tarball URL:</div><div class="release-value"><a id="tarball-url" href="#" target="_blank">Download Tarball</a></div>
    <div class="release-title">Zipball URL:</div><div class="release-value"><a id="zipball-url" href="#" target="_blank">Download Zip</a></div>
  </div>
  <div class="description"><span class="release-title">Description:</span> <span id="release-body"></span></div>
  <div class="button-container"><a id="download-link" class="button" href="#" target="_blank">Download Latest Setup</a></div>
</div>

<script>
  fetch("https://api.github.com/repos/MuathHassoun/battorion-version/releases/latest")
    .then(res => res.json())
    .then(data => {
      document.getElementById("version-text").innerText = `Latest Version: ${data.tag_name}`;
      const authorDiv = document.getElementById("author-info");
      const author = data.author;
      authorDiv.innerHTML = `<img src="${author.avatar_url}" alt="Author"><a href="${author.html_url}" target="_blank">${author.login}</a>`;

      document.getElementById("release-name").innerText = data.name;
      document.getElementById("prerelease").innerText = data.prerelease ? "Yes" : "No";
      document.getElementById("created-at").innerText = new Date(data.created_at).toLocaleString();
      document.getElementById("published-at").innerText = new Date(data.published_at).toLocaleString();
      document.getElementById("updated-at").innerText = new Date(data.updated_at).toLocaleString();
      document.getElementById("html-url").href = data.html_url;
      document.getElementById("tarball-url").href = data.tarball_url;
      document.getElementById("zipball-url").href = data.zipball_url;
      document.getElementById("release-body").innerText = data.body;

      const mainAsset = data.assets.find(asset => asset.name.includes("_battorion") && asset.name.endsWith(".exe"));
      if(mainAsset){
        document.getElementById("file-name").innerText = mainAsset.name;
        document.getElementById("file-size").innerText = (mainAsset.size / (1024*1024)).toFixed(2) + " MB";
        document.getElementById("content-type").innerText = mainAsset.content_type;
        document.getElementById("download-count").innerText = mainAsset.download_count;
        document.getElementById("digest").innerText = mainAsset.digest;
        document.getElementById("download-link").href = mainAsset.browser_download_url;
      }
    })
    .catch(error => {
      document.getElementById("version-text").innerText = `Failed to load release info`;
    });
</script>
<script src="../js/app.js"></script>
<script src="../js/_xhtr.js"></script>
</body>
</html>
