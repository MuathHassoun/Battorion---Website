<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <title>Contact Support</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="stylesheet" href="../css/contact-modern.css" />
  <link rel="icon" href="../img/battorion.png" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <header>
    <h1>📞 Contact Support</h1>
    <p>If you're facing issues or have any questions, we're here to help!</p>
  </header>

  <section class="contact-form">
    <h2>Reach Out To Us</h2>
    <form id="contact-form" data-form-title="Form Name">
      <label for="name">Full Name</label>
      <input type="text" id="name" name="name" placeholder="John Doe" required>

      <label for="email">Email Address</label>
      <input type="email" id="email" name="email" placeholder="you@example.com" required>

      <label for="phone">Phone (optional)</label>
      <input type="tel" id="phone" name="phone" placeholder="+1234567890">

      <label for="subject">Subject</label>
      <input type="text" id="subject" name="subject" placeholder="e.g. Problem with the app" required>

      <label for="category">Category</label>
      <select id="category" name="category" required>
        <option value="">-- Select --</option>
        <option value="technical">Technical Issue</option>
        <option value="billing">Billing</option>
        <option value="feedback">Feedback</option>
        <option value="other">Other</option>
      </select>

      <label for="message">Your Message</label>
      <textarea id="message" name="message" placeholder="Write your message here..." required></textarea>

      <div class="buttons">
        <button type="submit">Send Message</button>
        <input type="file" id="screenshotInput" accept="image/*" style="display: none;" />
        <button type="button" id="uploadBtn">Upload Screenshot</button>
        <button type="reset">Clear</button>
        <a href="Test.html" ></a>
      </div>
      <br>
      <div id="selected-file" class="mt-3" style="display: none;"></div>
      <div id="form-response" class="mt-3" style="display: none;"></div>
    </form>
  </section>

  <footer>
    <p>🔒 Your message is secure. Expect a reply within 24 hours.</p>
    <p>&copy; 2025 Smart Battery Monitor – All rights reserved.</p>
  </footer>
  <script>
    document.getElementById("uploadBtn").addEventListener("click", function () {
      document.getElementById("screenshotInput").click();
    });

    document.getElementById("screenshotInput").addEventListener("change", function (event) {
      const file = event.target.files[0];
      if (file) {
        const selectedFileDiv = document.getElementById("selected-file");
        selectedFileDiv.style.display = "block";
        selectedFileDiv.className = "success";
        selectedFileDiv.innerText = "Selected file: " + file.name;
      }
    });
  </script>
  <script src="../js/app.js"></script>
  <script src="../js/submit.js"></script>
</body>
</html>
