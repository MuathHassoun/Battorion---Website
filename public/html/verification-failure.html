<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Battorion | Email Verification Failed</title>
  <link rel="icon" href="../img/logo.svg" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&display=swap');
    * {
      font-family: 'Merriweather', serif;
    }

    :root {
      --bg: linear-gradient(to bottom, #f5f7fa, #dce3ed);
      --text: #1e1e2f;
      --card-bg: rgba(255,255,255,0.96);
      --btn-bg: #e74c3c;
      --text-muted: #666a6d;
      --subtitle-color: #555f68;
      --card-shadow: 0 6px 20px rgba(0,0,0,0.08);
    }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .verification-box {
      background: var(--card-bg);
      padding: 40px 60px;
      border-radius: 15px;
      box-shadow: var(--card-shadow);
      text-align: center;
      max-width: 500px;
      width: 90%;
    }
    h1 {
      margin-bottom: 15px;
      font-size: 28px;
      color: #c0392b;
    }
    p {
      margin-bottom: 20px;
      color: var(--subtitle-color);
      white-space: pre-line;
    }
    .btn-home {
      background: var(--btn-bg);
      color: #fff;
      border: none;
      padding: 12px 25px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: filter 0.2s;
    }
    .btn-home:hover {
      filter: brightness(1.1);
    }
  </style>
</head>
<body>
  <div class="verification-box">
    <h1>❌ Email Verification Failed</h1>
    <p id="main_message">We could not verify your email. Please try again later or request a new verification link.</p>
    <p id="error_status"></p>
    <button class="btn-home" onclick="window.location.href='../html/contactus.html'">Back to Contact Us Form</button>
  </div>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const error = urlParams.get('error');
    const errorPara = document.getElementById('error_status');
    const mainMessage = document.getElementById('main_message');
    const errorMessages = {
      "invalid_email": "Your email address appears to be invalid. Please check it and try again.",
      "token_generation_failed_500": "We couldn't generate a verification token due to a server error. Please try again later.",
      "email_sending_failed_400": "There was a problem sending the verification email. Please make sure your email is correct.",
      "unknown_error": "An unknown error occurred. Please try again later."
    };

    if (error) {
      const decodedError = decodeURIComponent(error);
      if (errorMessages[decodedError]) {
        mainMessage.textContent = errorMessages[decodedError];
        errorPara.textContent = "";
      } else {
        errorPara.textContent = `Error Details:\n${decodedError}`;
      }
    } else {
      errorPara.textContent = "An unexpected error occurred, but the exact cause could not be detected.";
    }
  </script>
  <script src="../js/app.js"></script>
  <script src="../js/_xhtr.js"></script>
</body>
</html>
