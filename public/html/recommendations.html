    const container = document.getElementById("software-container");
    const input = document.getElementById("searchInput");
    const stats = document.getElementById("stats");

    const updateStats = () => {
      const total = programs.length;
      const osGroups = {
          Windows: 0,
          macOS: 0,
          Linux: 0,
          CrossPlatform: 0
      };

      programs.forEach(p => {
          const osList = p.os?.toLowerCase() || "";
          const isWindows = osList.includes("windows");
          const isMac = osList.includes("macos");
          const isLinux = osList.includes("linux");
          if (isWindows && isMac && isLinux) {
              osGroups.CrossPlatform++;
          } else {
              if (isWindows) osGroups.Windows++;
              if (isMac) osGroups.macOS++;
              if (isLinux) osGroups.Linux++;
          }
      });

      stats.textContent = `${total} Applications – ` +
          `Windows: ${osGroups.Windows}, ` +
          `macOS: ${osGroups.macOS}, ` +
          `Linux: ${osGroups.Linux}, ` +
          `Cross-Platform: ${osGroups.CrossPlatform}`;
    };


    const render = (filter = "") => {
      container.innerHTML = "";
      const filtered = programs.filter(p => p.name.toLowerCase().includes(filter.toLowerCase()));
      filtered.forEach(p => {
        const div = document.createElement("div");
        div.className = "program-card";
        div.innerHTML = `
            ${p.image ? `<img src="${p.image}" alt="${p.name}" class="program-image">` : ""}
            <h3>${p.name}</h3>
            ${p.company ? `<p><strong>Company:</strong> ${p.company}</p>` : ""}
            ${p.os ? `<p><strong>OS:</strong> <span class="badge os">${p.os}</span></p>` : ""}
            ${p.license ? `<p><strong>License:</strong> <span class="badge">${p.license}</span></p>` : ""}
            ${p.core ? `<p><strong>CPU:</strong> ${p.core}</p>` : ""}
            ${p.size ? `<p><strong>Size:</strong> ${p.size}</p>` : ""}
            ${p.description ? `<p><strong>Description:</strong> ${p.description}</p>` : ""}
            ${p.links && p.links.length ? `<div class="links">${p.links.map(link => `<a href="${link.url}" target="_blank">${link.label}</a>`).join("<br>")}</div>` : ""}
        `;
        container.appendChild(div);
      });
    };

    input.addEventListener("input", () => render(input.value));
    document.getElementById("toggle-dark").onclick = () => document.body.classList.toggle("dark");
    const scrollTopBtn = document.getElementById("scrollTopBtn");
    window.onscroll = () => scrollTopBtn.style.display = window.scrollY > 200? "block":"none";
    scrollTopBtn.onclick = () => window.scrollTo({ top: 0, behavior: "smooth" });
    render();
    updateStats();
