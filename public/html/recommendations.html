<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recommended | Related Software</title>
  <link rel="stylesheet" href="../css/recommendation-style.css" />
  <link rel="icon" href="../img/logo.svg" />
</head>
<body class="dark">
  <header>
    <div class="header-title">
      <h1>🔧 Recommended Related Software</h1>
      <p id="stats">Loading stats...</p>
    </div>

    <div class="header-content">
      <div class="return-home" id="return-home">
        <img src="../img/logo.svg" alt="">
        <label id="return-label">Battorion - Home Page</label>
      </div>

      <div class="top-controls">
        <div class="control-group">
          <input type="text" id="searchInput" placeholder="🔍 Search..." title="Type here to search programs" />
          <select id="sortSelect" title="Select a sorting method">
            <option value="">Sort by...</option>
            <option value="name" title="Sort by Name (A–Z)">Name (A–Z)</option>
            <option value="size" title="Sort by Size">Size</option>
            <option value="os" title="Sort by Operating System">Operating System</option>
            <option value="license" title="Sort by License">License</option>
          </select>
        </div>

        <div class="control-group" id="osFilter">
          <button data-os="all" class="active" title="Show all OS">All</button>
          <button data-os="windows" title="Show only Windows programs">Windows</button>
          <button data-os="macos" title="Show only macOS programs">macOS</button>
          <button data-os="linux" title="Show only Linux programs">Linux</button>
        </div>

        <div class="control-group">
          <button id="toggle-dark" title="Toggle Dark/Light Mode">🌓</button>
          <button id="toggle-compact" title="Toggle Compact View">🗂️</button>
        </div>
      </div>
    </div>
  </header>
  <main id="software-container"></main>
  <button id="scrollTopBtn">⇧</button>

  <script src="../js/app.js"></script>
  <script src="../js/_xhtr.js"></script>
  <script src="../js/programs-data.js"></script>
  <script>
    const container = document.getElementById("software-container");
    const input = document.getElementById("searchInput");
    const stats = document.getElementById("stats");
    const back_to_home = document.getElementById("return-home");
    const return_label = document.getElementById("return-label");
    const scrollTopBtn = document.getElementById("scrollTopBtn");

    const updateStats = () => {
      const total = programs.length;
      const osGroups = {
        Windows: 0,
        macOS: 0,
        Linux: 0,
        CrossPlatform: 0
      };

      programs.forEach(p => {
        const osList = p.os?.toLowerCase() || "";
        const isWindows = osList.includes("windows");
        const isMac = osList.includes("macos");
        const isLinux = osList.includes("linux");
        if (isWindows && isMac && isLinux) {
          osGroups.CrossPlatform++;
        } else {
          if (isWindows) osGroups.Windows++;
          if (isMac) osGroups.macOS++;
          if (isLinux) osGroups.Linux++;
        }
      });

      stats.textContent = `${total} Applications – ` +
        `Windows: ${osGroups.Windows}, ` +
        `macOS: ${osGroups.macOS}, ` +
        `Linux: ${osGroups.Linux}, ` +
        `Cross-Platform: ${osGroups.CrossPlatform}`;
    };

    const render = (data = programs) => {
      container.innerHTML = "";
      data.forEach(p => {
        const div = document.createElement("div");
        div.className = "program-card";
        div.innerHTML = `
      ${p.image ? `<img src="${p.image}" alt="${p.name}" class="program-image">` : ""}
      <h3>${p.name}</h3>
      ${p.company ? `<p><strong>Company:</strong> ${p.company}</p>` : ""}
      ${p.os ? `<p><strong>OS:</strong> <span class="badge os">${p.os}</span></p>` : ""}
      ${p.license ? `<p><strong>License:</strong> <span class="badge">${p.license}</span></p>` : ""}
      ${p.core ? `<p><strong>CPU:</strong> ${p.core}</p>` : ""}
      ${p.size ? `<p><strong>Size:</strong> ${p.size}</p>` : ""}
      ${p.description ? `<p><strong>Description:</strong> ${p.description}</p>` : ""}
      ${p.links && p.links.length ? `<div class="links">${p.links.map(link => `<a href="${link.url}" target="_blank">${link.label}</a>`).join("<br>")}</div>` : ""}
    `;
        container.appendChild(div);
      });
    };

    // 🔹 Search
    input.addEventListener("input",()=>{
      const term=input.value.toLowerCase();
      render(programs.filter(p=>p.name.toLowerCase().includes(term)));
    });

    // 🔹 Sort
    document.getElementById("sortSelect").onchange=e=>{
      const v=e.target.value;
      if(v==="name") programs.sort((a,b)=>a.name.localeCompare(b.name));
      if(v==="size") programs.sort((a,b)=>parseFloat(a.size)||0 - (parseFloat(b.size)||0));
      if(v==="os") programs.sort((a,b)=>a.os.localeCompare(b.os));
      if(v==="license") programs.sort((a,b)=>a.license.localeCompare(b.license));
      render();
    };

    // 🔹 Filter by OS
    document.querySelectorAll("#osFilter button").forEach(btn=>{
      btn.onclick=()=>{
        document.querySelectorAll("#osFilter button").forEach(b=>b.classList.remove("active"));
        btn.classList.add("active");
        const os=btn.dataset.os;
        render(os==="all"?programs:programs.filter(p=>p.os.toLowerCase().includes(os)));
      };
    });

    // 🔹 Dark Mode
    document.getElementById("toggle-dark").onclick=()=>document.body.classList.toggle("dark");

    // 🔹 Compact Mode
    const compactToggle=document.getElementById("toggle-compact");
    compactToggle.onclick=()=>{
      container.classList.toggle("compact-view");
      compactToggle.textContent=container.classList.contains("compact-view")?"📋":"🗂️";
    };

    back_to_home.addEventListener("click",()=>{
      window.location.href="../index.html";
    })

    return_label.addEventListener("click",()=>{
      window.location.href="../index.html";
    })

    window.onscroll = () => scrollTopBtn.style.display = window.scrollY > 200? "block":"none";
    scrollTopBtn.onclick = () => window.scrollTo({ top: 0, behavior: "smooth" });
    render();
    updateStats();
  </script>
  <footer>
    <p>&copy; 2025 Battorion Recommendations – All rights reserved.</p>
  </footer>
</body>
</html>
