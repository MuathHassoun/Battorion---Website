<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>404 Page Not Found · Battorion</title>
  <link rel="icon" href="img/battorion.png" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      color: #fff;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 2rem;
    }

    header svg {
      max-width: 100%;
      height: auto;
      filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.5));
      margin-bottom: 2rem;
      margin-left: 50px;
    }

    .message {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(10px);
      border-radius: 24px;
      padding: 3rem 2rem;
      max-width: 600px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      animation: fadeIn 1.2s ease;
    }

    h1 {
      font-size: 112px;
      font-weight: 300;
      margin-bottom: 1rem;
      text-shadow: 2px 4px 10px rgba(0, 0, 0, 0.4);
    }

    h2 {
      font-size: 2rem;
      font-weight: 500;
      color: #e0e0e0;
    }

    a {
      text-decoration: none;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(-30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 72px;
      }

      h2 {
        font-size: 1.5rem;
      }

      .message {
        padding: 2rem 1rem;
      }
    }
  </style>
</head>
<body>
  <header style="display: flex; align-items: center; gap: 2rem;">
    <a href="https://battorion-website.vercel.app/" style="display: flex; align-items: center;">
      <svg width="600" height="150" viewBox="0 0 600 150" xmlns="http://www.w3.org/2000/svg">
        <g transform="rotate(-5, 60, 75)">
          <rect x="30" y="20" width="60" height="110" rx="10" fill="#1de9b6" stroke="#fff" stroke-width="3"/>
          <rect x="45" y="5" width="30" height="15" rx="4" fill="#ffffffcc"/>
          <polygon points="60,40 50,75 65,75 55,110" fill="#fff"/>
        </g>
        <text x="120" y="95" font-size="70" fill="#ffffffcc" font-family="Segoe UI, sans-serif" font-weight="600">Battorion</text>
        <text x="125" y="125" font-size="20" fill="#ffffff99" font-family="Segoe UI, sans-serif">Next-Gen Battery & System Intelligence</text>
      </svg>
    </a>
  </header>

  <div class="message">
    <h1>404</h1>
    <h2>Oops! This page doesn’t exist.</h2>
    <p style="margin-top: 2rem; font-size: 1.1rem;">
      Not sure what happened?
      <a href="./html/contactus.html" style="color: #1de9b6; font-weight: bold;">
        Get in touch with our support team
      </a>, and we'll sort it out together.
    </p>
  </div>
  <script src="js/app.js"></script>
  <script src="js/_xhtr.js"></script>
</body>
</html>
