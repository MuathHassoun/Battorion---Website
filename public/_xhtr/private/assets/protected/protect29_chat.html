<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Battorion Chat System</title>
  <link rel="icon" href="icon.svg" />
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="chat-wrapper">
    <div class="theme-toggle" onclick="toggleTheme()">🌓</div>
    <div class="chat-container">
      <aside class="sidebar">
        <div class="sidebar-header">Users</div>
        <ul class="user-list" id="user-list"></ul>
      </aside>
      <main class="chat-box">
        <header class="chat-header" id="chat-header">Select a user to chat</header>
        <div class="chat-messages" id="chat-messages"></div>
        <form class="chat-input-container" id="chat-form" style="display: none;">
          <input type="text" id="chat-input" placeholder="Type your message..." autocomplete="off" />
          <button type="submit">Send</button>
        </form>
      </main>
    </div>
  </div>
  <script>
    function toggleTheme() {
      const html = document.documentElement;
      html.dataset.theme = html.dataset.theme === "light" ? "dark" : "light";
    }
  </script>
  <script src="chat_system.js"></script>
  <script src="../../../../js/_xhtr.js"></script>
  <script src="../../../../js/app.js"></script>
</body>
</html>
